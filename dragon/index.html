<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>无赎弓流程 · 龙前装备攻略</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-hover: #243044;
      --border: #2d3f56;
      --text: #e8edf4;
      --muted: #8b9cb3;
      --accent: #f0b429;
      --accent-dim: #c4921f;
      --bow-seal: #5b8def;
      --bow-mark: #b07cff;
      --bow-demon: #ef6b6b;
      --success: #3ecf8e;
      --danger: #ef4444;
      --chapter-colors: #3ecf8e, #5b8def, #b07cff, #f0b429, #ef6b6b, #06b6d4, #a78bfa, #f97316, #ec4899;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Noto Sans SC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 50% -20%, rgba(91, 141, 239, 0.12), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(240, 180, 41, 0.08), transparent);
      pointer-events: none;
      z-index: 0;
    }

    .app { position: relative; z-index: 1; max-width: 1400px; margin: 0 auto; padding: 24px 20px 80px; }

    header {
      text-align: center;
      margin-bottom: 32px;
      padding-bottom: 24px;
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.5rem, 4vw, 2rem);
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent), #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    header p { color: var(--muted); font-size: 0.9rem; }
    header a { color: var(--accent); text-decoration: none; }
    header a:hover { text-decoration: underline; }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 20px 0 28px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      background: var(--surface);
      padding: 6px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }

    .dot { width: 10px; height: 10px; border-radius: 50%; }
    .dot.seal { background: var(--bow-seal); }
    .dot.mark { background: var(--bow-mark); }
    .dot.demon { background: var(--bow-demon); }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
      align-items: center;
    }

    .search-box {
      flex: 1;
      min-width: 200px;
      padding: 10px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-box:focus { border-color: var(--accent); }

    .chapter-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chapter-tab {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .chapter-tab:hover, .chapter-tab.active {
      background: var(--surface-hover);
      color: var(--text);
      border-color: var(--accent-dim);
    }

    .chapter-tab.active { box-shadow: 0 0 0 1px var(--accent-dim); }

    .phase-tabs {
      display: flex;
      gap: 6px;
    }

    .phase-tab {
      padding: 8px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--muted);
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .phase-tab:hover { background: var(--surface-hover); color: var(--text); }
    .phase-tab.active {
      background: rgba(240, 180, 41, 0.15);
      color: var(--accent);
      border-color: var(--accent-dim);
    }

    .chapter-section.post-dragon .chapter-badge::after {
      content: "龙后";
      font-size: 0.55rem;
      margin-left: 4px;
      opacity: 0.85;
    }

    .stage-card.finale::before { background: linear-gradient(90deg, #fde047, #f472b6, #fde047); }

    .flow-container { position: relative; }

    .chapter-section {
      margin-bottom: 40px;
      scroll-margin-top: 20px;
    }

    .chapter-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      padding-left: 4px;
    }

    .chapter-badge {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .chapter-title { font-size: 1.15rem; font-weight: 600; }
    .chapter-subtitle { font-size: 0.85rem; color: var(--muted); }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
      position: relative;
    }

    .stage-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
      position: relative;
      overflow: hidden;
    }

    .stage-card::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: var(--chapter-color, var(--accent));
    }

    .stage-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--chapter-color, var(--accent-dim));
    }

    .stage-card.prep { border-style: dashed; }
    .stage-card.dps-check::after {
      content: "DPS检测";
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 0.65rem;
      background: rgba(239, 107, 107, 0.2);
      color: var(--bow-demon);
      padding: 2px 8px;
      border-radius: 4px;
      font-weight: 600;
    }

    .stage-name {
      font-weight: 600;
      font-size: 1rem;
      margin-bottom: 12px;
      padding-right: 60px;
    }

    .equip-row {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .equip-item {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      font-size: 0.82rem;
    }

    .equip-label {
      flex-shrink: 0;
      width: 28px;
      font-weight: 600;
      color: var(--muted);
      font-family: "JetBrains Mono", monospace;
      font-size: 0.75rem;
    }

    .equip-value { flex: 1; line-height: 1.4; }

    .bow-tag {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      margin-left: 4px;
      vertical-align: middle;
    }

    .bow-tag.seal { background: rgba(91, 141, 239, 0.25); color: var(--bow-seal); }
    .bow-tag.mark { background: rgba(176, 124, 255, 0.25); color: var(--bow-mark); }
    .bow-tag.demon { background: rgba(239, 107, 107, 0.25); color: var(--bow-demon); }
    .bow-tag.magic { background: rgba(244, 114, 182, 0.25); color: #f472b6; }

    .dot.magic { background: #f472b6; }

    .accessories-preview {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
      font-size: 0.78rem;
      color: var(--muted);
    }

    .accessories-preview span { color: var(--accent); }

    .accessory-image-wrap {
      margin-top: 10px;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
    }

    .accessory-image-wrap img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }

    .accessory-image-label {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 6px 10px;
      border-top: 1px solid var(--border);
    }

    .detail-images {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .detail-image-block {
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.25);
    }

    .detail-image-block img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
    }

    .detail-image-caption {
      padding: 8px 12px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
    }

    .image-lightbox {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(0, 0, 0, 0.92);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s, visibility 0.2s;
      cursor: zoom-out;
    }

    .image-lightbox.open { opacity: 1; visibility: visible; }

    .image-lightbox img {
      max-width: min(960px, 95vw);
      max-height: 90vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .click-hint {
      margin-top: 10px;
      font-size: 0.72rem;
      color: var(--muted);
      opacity: 0.7;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.25s, visibility 0.25s;
    }

    .modal-overlay.open { opacity: 1; visibility: visible; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      max-width: 720px;
      width: 100%;
      max-height: 85vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: var(--shadow);
      transform: scale(0.95) translateY(10px);
      transition: transform 0.25s;
    }

    .modal-overlay.open .modal { transform: scale(1) translateY(0); }

    .modal-header {
      padding: 20px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }

    .modal-header h2 { font-size: 1.25rem; font-weight: 700; }
    .modal-chapter { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }

    .modal-close {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 1.5rem;
      cursor: pointer;
      line-height: 1;
      padding: 4px;
      border-radius: 6px;
      transition: color 0.2s, background 0.2s;
    }

    .modal-close:hover { color: var(--text); background: var(--surface-hover); }

    .modal-body {
      padding: 20px 24px 24px;
      overflow-y: auto;
    }

    .detail-section { margin-bottom: 20px; }
    .detail-section:last-child { margin-bottom: 0; }

    .detail-section h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--accent);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .detail-grid {
      display: grid;
      gap: 8px;
    }

    .detail-row {
      display: grid;
      grid-template-columns: 80px 1fr;
      gap: 8px;
      font-size: 0.9rem;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
    }

    .detail-row .label { color: var(--muted); font-weight: 500; }

    .detail-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .detail-list li {
      font-size: 0.88rem;
      padding: 8px 12px;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      border-left: 3px solid var(--border);
    }

    .detail-list li.farm { border-left-color: var(--success); }
    .detail-list li.craft { border-left-color: var(--bow-seal); }
    .detail-list li.tip { border-left-color: var(--accent); }
    .detail-list li.warn { border-left-color: var(--danger); }

    .tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }

    .tag {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 12px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
    }

    .progression-bar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 32px;
      overflow-x: auto;
    }

    .progression-bar h2 {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 16px;
      font-weight: 500;
    }

    .progression-track {
      display: flex;
      align-items: center;
      gap: 0;
      min-width: max-content;
      padding-bottom: 4px;
    }

    .progress-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      padding: 0 4px;
      transition: transform 0.2s;
    }

    .progress-node:hover { transform: scale(1.05); }

    .progress-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg);
      transition: all 0.2s;
    }

    .progress-node.active .progress-dot,
    .progress-node:hover .progress-dot {
      background: var(--node-color, var(--accent));
      border-color: var(--node-color, var(--accent));
      box-shadow: 0 0 12px var(--node-color, var(--accent));
    }

    .progress-label {
      font-size: 0.65rem;
      color: var(--muted);
      max-width: 56px;
      text-align: center;
      line-height: 1.2;
    }

    .progress-line {
      width: 24px;
      height: 2px;
      background: var(--border);
      flex-shrink: 0;
    }

    footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.8rem;
    }

    @media (max-width: 600px) {
      .detail-row { grid-template-columns: 1fr; gap: 4px; }
      .stage-card.dps-check::after { font-size: 0.6rem; top: 10px; right: 10px; }
    }
  </style>
</head>

  <div class="app">
    <header>

      <p>

      if (!images.length) return "";

      if (compact) {
        return `
          <div class="accessory-image-wrap" data-no-modal="true">

      }
      return `
        <div class="detail-section">
          <h3>增伤饰品配置</h3>
          <div class="detail-images">
            ${images.map((url, i) => `
              <div class="detail-image-block" data-no-modal="true">
                <img src="${url}" alt="${stage.name} 增伤饰品${images.length > 1 ? " " + (i + 1) : ""}" loading="lazy" referrerpolicy="no-referrer" />
                ${images.length > 1 ? `<div class="detail-image-caption">${captions[i] || `配图 ${i + 1}`}</div>` : ""}
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    function openLightbox(src, alt) {
      const lb = document.getElementById("imageLightbox");
      const img = document.getElementById("lightboxImg");
      img.src = src;
      img.alt = alt || "增伤饰品配置";
      lb.classList.add("open");
      lb.setAttribute("aria-hidden", "false");
    }

    function closeLightbox() {
      const lb = document.getElementById("imageLightbox");
      lb.classList.remove("open");
      lb.setAttribute("aria-hidden", "true");
      document.getElementById("lightboxImg").removeAttribute("src");
      if (!document.getElementById("modalOverlay").classList.contains("open")) {
        document.body.style.overflow = "";
      }
    }

    function bindImageZoom(root) {
      root.querySelectorAll(".accessory-image-wrap img, .detail-image-block img").forEach((img) => {

          openLightbox(img.src, img.alt);

            accessories: "见原文第41图",

            ],
            farm: [],
            craft: ["虚无之书", "魂之接力", "破空之愿"],
            warn: ["降低灵魂净化度有风险"],
          },
          {
            id: "dragon",
            name: "末影龙",
            bow: "咒魂弓『封弓』",
            bowType: "seal",
            arrows: "木箭",
            accessories: "见原文第42图",
            tips: [
              "只用咒魂弓，切别的弓箭破适应",
              "神秘龙蛋必做（+100祈愿），右键天空之城奖杯",
              "可做神秘无名饰品（狂暴之心、永恒之翼）；罪孽囚笼不必叠满",

              "末影龙魄兑配饰栏：建议游侠徽章或石巨人"
            ],
            farm: ["塔罗牌·教皇", "末影龙魄→配饰栏位"],
            craft: [
              "神秘龙蛋",
              "罪孽囚笼",
              "末影处刑弓『妖弓』",
              "心之项链",
              "暗影瘟疫",
              "保护/魔保20级",
              "神秘无名饰品（狂暴之心/永恒之翼）"
            ],
          },
          {
            id: "tree",
            name: "神树之根-无边恶意",
            bow: "海王弓『封弓』",
            bowEnchants: "无尽箭袋 + 力量10",
            bowType: "seal",
            arrows: "吸血下界合金箭",
            accessories: "见原文第45图 · 罪孽囚笼~30%",
            tips: [
              "龙前最后一战；海王弓平推，罪孽囚笼属性刷到约30%",
              "提交不稳定红石余烬：先领下方祈愿与元始珍珠（可选深度抵抗/寒冷抗性护符），勿急领任务奖励",
              "伤害够则余烬可保留一个等后续复制，不必急换宝石"
            ],
            farm: [],
            craft: [
              "简易重铸台", "回收台", "优秀神化宝石",
              "灵魂方舟", "天体果实",
            ],
          },
        ],
      },
    ];

    function parseBowTags(text, type) {
      if (!text || text === "—") return text;
      let html = text;
      html = html.replace(/『封弓』/g, '<span class="bow-tag seal">封弓</span>');
      html = html.replace(/『印弓』/g, '<span class="bow-tag mark">印弓</span>');
      html = html.replace(/『妖弓』/g, '<span class="bow-tag demon">妖弓</span>');
      html = html.replace(/『魔弓』/g, '<span class="bow-tag magic">魔弓</span>');
      return html;
    }

    function mergePostDragonData() {
      const pd = window.MC_POST_DRAGON;
      if (!pd) return;
      CHAPTER_COLORS.push(...pd.extraColors);
      BOW_PROGRESSION.push(...pd.progression);
      Object.assign(IMAGE_CAPTIONS, pd.imageCaptions || {});
      Object.entries(pd.images).forEach(([id, paths]) => {
        STAGE_IMAGES[id] = paths.map((p) => (p.startsWith("http") ? p : `${IMG_BASE}/${p}`));
      });
      DATA.push(...pd.chapters);
    }

    function getChapterPhase(ch) {
      return ch.phase || (ch.chapter < 10 ? "pre" : "post");
    }

    function renderProgression() {
      const track = document.getElementById("progressionTrack");
      BOW_PROGRESSION.forEach((item, i) => {
        if (i > 0) {
          const line = document.createElement("div");
          line.className = "progression-line";
          track.appendChild(line);
        }
        const node = document.createElement("div");
        node.className = "progress-node";
        node.style.setProperty("--node-color", CHAPTER_COLORS[item.chapter] || "#f0b429");
        node.innerHTML = `
          <div class="progress-dot"></div>
          <div class="progress-label">${item.name}</div>
        `;
        node.addEventListener("click", () => {
          const section = document.querySelector(`.chapter-section[data-chapter="${item.chapter}"]`);
          if (!section) return;
          document.querySelectorAll(".phase-tab").forEach((t) => t.classList.remove("active"));
          document.querySelector(".phase-tab[data-phase='all']")?.classList.add("active");
          document.querySelectorAll(".chapter-tab").forEach((t) => t.classList.remove("active"));
          document.querySelector(".chapter-tab[data-chapter='all']")?.classList.add("active");
          document.getElementById("searchBox").value = "";
          filterStages();
          section.scrollIntoView({ behavior: "smooth" });
        });
        track.appendChild(node);
      });
    }

    function renderChapterTabs() {
      const tabs = document.getElementById("chapterTabs");
      const all = document.createElement("button");
      all.className = "chapter-tab active";
      all.textContent = "全部";
      all.dataset.chapter = "all";
      tabs.appendChild(all);

      DATA.forEach((ch) => {
        const btn = document.createElement("button");
        btn.className = "chapter-tab";
        btn.textContent = ch.title;
        btn.dataset.chapter = ch.chapter;
        tabs.appendChild(btn);
      });

      tabs.addEventListener("click", (e) => {
        const tab = e.target.closest(".chapter-tab");
        if (!tab) return;
        tabs.querySelectorAll(".chapter-tab").forEach((t) => t.classList.remove("active"));
        tab.classList.add("active");
        filterStages();
      });
    }

    function renderFlow() {
      const container = document.getElementById("flowContainer");
      DATA.forEach((ch) => {
        const section = document.createElement("section");
        section.className = "chapter-section" + (getChapterPhase(ch) === "post" ? " post-dragon" : "");
        section.dataset.chapter = ch.chapter;
        section.dataset.phase = getChapterPhase(ch);
        section.style.setProperty("--chapter-color", CHAPTER_COLORS[ch.chapter]);

        section.innerHTML = `
          <div class="chapter-header">
            <div class="chapter-badge" style="background:${CHAPTER_COLORS[ch.chapter]}22;color:${CHAPTER_COLORS[ch.chapter]}">${ch.chapter}</div>
            <div>
              <div class="chapter-title">${ch.title} · ${ch.subtitle.split("·")[0].trim()}</div>
              <div class="chapter-subtitle">${ch.subtitle}</div>
            </div>
          </div>
          <div class="stage-grid"></div>
        `;

        const grid = section.querySelector(".stage-grid");
        ch.stages.forEach((stage) => {
          const card = document.createElement("article");
          card.className = "stage-card"
            + (stage.prep ? " prep" : "")
            + (stage.dpsCheck ? " dps-check" : "")
            + (stage.finale ? " finale" : "");
          card.style.setProperty("--chapter-color", CHAPTER_COLORS[ch.chapter]);
          card.dataset.search = [
            stage.name, stage.bow, stage.arrows, stage.armor, stage.accessories,
            stage.affixes, stage.gems,
            ...(stage.tips || []), ...(stage.farm || []), ...(stage.craft || []),
          ].filter(Boolean).join(" ").toLowerCase();

          const bowDisplay = parseBowTags(stage.bow || "—");
          const enchants = stage.bowEnchants ? `<br><small style="color:var(--muted)">${stage.bowEnchants}</small>` : "";
          const images = getStageImages(stage);
          const accessoryText = cleanAccessoryText(stage.accessories);

          card.innerHTML = `
            <div class="stage-name">${stage.name}</div>
            <div class="equip-row">
              <div class="equip-item">
                <span class="equip-label">弓</span>
                <span class="equip-value">${bowDisplay}${enchants}</span>
              </div>
              <div class="equip-item">
                <span class="equip-label">箭</span>
                <span class="equip-value">${stage.arrows || "—"}</span>
              </div>
              ${stage.armor ? `<div class="equip-item"><span class="equip-label">甲</span><span class="equip-value">${stage.armor}</span></div>` : ""}
              ${stage.affixes ? `<div class="equip-item"><span class="equip-label">词条</span><span class="equip-value">${stage.affixes}</span></div>` : ""}
              ${stage.gems ? `<div class="equip-item"><span class="equip-label">宝石</span><span class="equip-value">${stage.gems}</span></div>` : ""}
            </div>
            ${accessoryText ? `<div class="accessories-preview">饰品：<span>${accessoryText}</span></div>` : ""}
            ${renderAccessoryImages(images, stage, true)}
            <div class="click-hint">点击查看详情 →</div>
          `;

          bindImageZoom(card);
          card.addEventListener("click", (e) => {
            if (e.target.closest("[data-no-modal]")) return;
            openModal(stage, ch);
          });
          grid.appendChild(card);
        });

        container.appendChild(section);
      });
    }

    function openModal(stage, chapter) {
      document.getElementById("modalTitle").textContent = stage.name;
      document.getElementById("modalChapter").textContent = `${chapter.title} · ${chapter.subtitle}`;

      const body = document.getElementById("modalBody");
      let html = "";
      const images = getStageImages(stage);
      const accessoryText = cleanAccessoryText(stage.accessories);

      html += renderAccessoryImages(images, stage, false);

      html += `<div class="detail-section"><h3>核心装备</h3><div class="detail-grid">`;
      if (stage.bow) html += `<div class="detail-row"><span class="label">弓</span><span>${parseBowTags(stage.bow)}${stage.bowEnchants ? " · " + stage.bowEnchants : ""}</span></div>`;
      if (stage.arrows) html += `<div class="detail-row"><span class="label">箭矢</span><span>${stage.arrows}</span></div>`;
      if (stage.armor) html += `<div class="detail-row"><span class="label">护甲</span><span>${stage.armor}</span></div>`;
      if (accessoryText) html += `<div class="detail-row"><span class="label">饰品</span><span>${accessoryText}</span></div>`;
      if (stage.affixes) html += `<div class="detail-row"><span class="label">词条</span><span>${stage.affixes}</span></div>`;
      if (stage.gems) html += `<div class="detail-row"><span class="label">宝石</span><span>${stage.gems}</span></div>`;
      const noteText = cleanAccessoryText(stage.accessoryNote);
      if (noteText) html += `<div class="detail-row"><span class="label">备注</span><span>${noteText}</span></div>`;
      html += `</div></div>`;

      if (stage.tips?.length) {
        html += `<div class="detail-section"><h3>打法要点</h3><ul class="detail-list">`;
        stage.tips.forEach((t) => { html += `<li class="tip">${t}</li>`; });
        html += `</ul></div>`;
      }

      if (stage.warn?.length) {
        html += `<div class="detail-section"><h3>注意事项</h3><ul class="detail-list">`;
        stage.warn.forEach((w) => { html += `<li class="warn">${w}</li>`; });
        html += `</ul></div>`;
      }

      if (stage.farm?.length) {
        html += `<div class="detail-section"><h3>建议刷取</h3><ul class="detail-list">`;
        stage.farm.forEach((f) => { html += `<li class="farm">${f}</li>`; });
        html += `</ul></div>`;
      }

      if (stage.craft?.length) {
        html += `<div class="detail-section"><h3>可制作物品</h3><ul class="detail-list">`;
        stage.craft.forEach((c) => { html += `<li class="craft">${c}</li>`; });
        html += `</ul></div>`;
      }

      if (stage.dpsCheck) {
        html += `<div class="tag-row"><span class="tag" style="border-color:var(--bow-demon);color:var(--bow-demon)">DPS 检测点</span></div>`;
      }

      body.innerHTML = html;
      bindImageZoom(body);
      document.getElementById("modalOverlay").classList.add("open");
      document.body.style.overflow = "hidden";
    }

    function closeModal() {
      document.getElementById("modalOverlay").classList.remove("open");
      if (!document.getElementById("imageLightbox").classList.contains("open")) {
        document.body.style.overflow = "";
      }
    }

    function filterStages() {
      const query = document.getElementById("searchBox").value.toLowerCase().trim();
      const activeTab = document.querySelector(".chapter-tab.active");
      const chapterFilter = activeTab?.dataset.chapter || "all";
      const activePhase = document.querySelector(".phase-tab.active");
      const phaseFilter = activePhase?.dataset.phase || "all";

      document.querySelectorAll(".chapter-section").forEach((section) => {
        const ch = section.dataset.chapter;
        const phase = section.dataset.phase;
        const chapterMatch = chapterFilter === "all" || chapterFilter === ch;
        const phaseMatch = phaseFilter === "all" || phaseFilter === phase;
        let anyVisible = false;

        section.querySelectorAll(".stage-card").forEach((card) => {
          const searchMatch = !query || card.dataset.search.includes(query);
          const visible = chapterMatch && phaseMatch && searchMatch;
          card.style.display = visible ? "" : "none";
          if (visible) anyVisible = true;
        });

        section.style.display = anyVisible ? "" : "none";
      });
    }

    document.getElementById("searchBox").addEventListener("input", filterStages);
    document.getElementById("phaseTabs").addEventListener("click", (e) => {
      const tab = e.target.closest(".phase-tab");
      if (!tab) return;
      document.querySelectorAll(".phase-tab").forEach((t) => t.classList.remove("active"));
      tab.classList.add("active");
      filterStages();
    });
    document.getElementById("modalClose").addEventListener("click", closeModal);
    document.getElementById("modalOverlay").addEventListener("click", (e) => {
      if (e.target === e.currentTarget) closeModal();
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") {
        if (document.getElementById("imageLightbox").classList.contains("open")) {
          closeLightbox();
        } else {
          closeModal();
        }
      }
    });

    document.getElementById("imageLightbox").addEventListener("click", closeLightbox);

    mergePostDragonData();
    renderProgression();
    renderChapterTabs();
    renderFlow();
  </script>
</body>
</html>
